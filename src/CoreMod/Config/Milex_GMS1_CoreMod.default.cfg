## Settings file was created by plugin Milex GMS1 CoreMod v1.4.0
## Plugin GUID: com.milex.gms1.core

[General]

## Key to open and close the mod menu.
# Setting type: KeyCode
# Default value: Insert
MenuToggleKey = Insert

## Pauses the game world (TimeScale = 0) while the mod menu is open.
# Setting type: Boolean
# Default value: false
PauseGameOnMenu = false

## Ignores external localization files on disk and loads directly from embedded DLL resources.
# Setting type: Boolean
# Default value: false
IgnoreExternalTranslations = false

[Performance]

## Periodically purges unused assets (Resources.UnloadUnusedAssets) and triggers GC during player-imperceptible moments to fight FPS loss.
# Setting type: Boolean
# Default value: true
EnableMemoryCleaner = true

## Minimum cooldown in seconds between automatic background memory cleans to prevent stutter.
# Setting type: Single
# Default value: 60
MemoryCleanCooldownSeconds = 60

## Automatically purge unused assets and collect memory during Fast Travel loading screens.
# Setting type: Boolean
# Default value: true
CleanOnFastTravel = true

## Automatically purge unused assets and collect memory when saving (Quicksave / Autosave).
# Setting type: Boolean
# Default value: true
CleanOnSave = true

## Automatically purge unused assets and collect memory when opening the laptop / tablet computer.
# Setting type: Boolean
# Default value: true
CleanOnLaptop = true

## Automatically purge unused assets and collect memory when opening the Mod Menu.
# Setting type: Boolean
# Default value: true
CleanOnMenuOpen = true

[Localization]

## Determines whether the game language is detected and used automatically.
# Setting type: Boolean
# Default value: true
UseGameLanguage = true

## Manually selected language code (only active when UseGameLanguage is false).
# Setting type: String
# Default value: en
SelectedLanguage = en

[UI]

## Scale factor of the mod menu interface (0.75 to 1.5 for High-DPI / 4K displays).
# Setting type: Single
# Default value: 1
UIScale = 1

## Interface engine style: Modern (uGUI Canvas Dashboard) or Classic (IMGUI).
# Setting type: MenuEngineType
# Default value: Modern
# Acceptable values: Modern, Classic
MenuEngine = Modern
