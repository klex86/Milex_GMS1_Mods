## Settings file was created by plugin Milex Claim Monitor v1.0.0
## Plugin GUID: com.milex.gms1.claimmonitor

[General]

## Determines whether Milex Claim Monitor is active. Can be toggled in the Mod Menu at runtime.
# Setting type: Boolean
# Default value: true
Enabled = true

## Interval in seconds between background equipment scans and health evaluations.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 30
ScanIntervalSeconds = 3

[Setups]

## Monitor mobile wash plants in the Warning HUD.
# Setting type: Boolean
# Default value: true
MonitorSetup1 = true

## Monitor stationary setup (T3-T5) in the Warning HUD.
# Setting type: Boolean
# Default value: true
MonitorSetup2 = true

## Setup T3-T5: Include feeding chain (hoppers and conveyors) in health evaluation.
# Setting type: Boolean
# Default value: true
Setup2IncludeFeedingChain = true

## Monitor Setup T6 (Orange Beast) in the Warning HUD.
# Setting type: Boolean
# Default value: false
MonitorSetup3 = false

## Setup T6: Include feeding chain (hoppers and conveyors) in health evaluation.
# Setting type: Boolean
# Default value: false
Setup3IncludeFeedingChain = false

## Include big generator socket switch buttons in wear and breakdown monitoring. Default is false (ignored) to prevent HUD clutter.
# Setting type: Boolean
# Default value: false
MonitorGeneratorSwitchButtons = false

[Thresholds]

## Mat fill percentage threshold to trigger a warning.
# Setting type: Single
# Default value: 90
# Acceptable value range: From 70 to 98
MatWarningThreshold = 90

## Vehicle fuel percentage threshold to trigger low fuel warning.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 5 to 30
VehicleLowFuelThreshold = 20

## Equipment part durability percentage threshold (1%-50%) to trigger an early wear warning before total breakdown.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 5 to 50
ComponentWearWarningThreshold = 20

[WarningHUD]

## Enable Warning HUD overlay on screen.
# Setting type: Boolean
# Default value: true
HudEnabled = true

## Only display the Warning HUD when there are active warnings or critical alerts.
# Setting type: Boolean
# Default value: false
HudOnlyShowWarnings = false

## Render HUD in ultra-compact mode with single-line status badge.
# Setting type: Boolean
# Default value: false
HudCompactMode = false

## Maximum width of the Warning HUD container.
# Setting type: Single
# Default value: 340
# Acceptable value range: From 200 to 800
HudMaxWidth = 340

## Maximum height of the Warning HUD container.
# Setting type: Single
# Default value: 420
# Acceptable value range: From 100 to 1000
HudMaxHeight = 420

[Fuel]

## Display fuel fill percentage directly inside the vehicle quick-switching bar.
# Setting type: Boolean
# Default value: true
ShowFuelInVehicleSwitcher = true

[Debug]

## Show detailed component debug inspection and raw object diagnostics in the menu.
# Setting type: Boolean
# Default value: false
EnableDebugGroup = false
